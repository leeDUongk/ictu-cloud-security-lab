# Nginx: điểm vào duy nhất của nền tảng; HTTP chuyển sang HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/web-paas.crt;
    ssl_certificate_key /etc/nginx/ssl/web-paas.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;

    location /static/ {
        alias /srv/demoapp/app/static/;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
