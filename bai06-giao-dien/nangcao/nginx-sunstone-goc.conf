# Bài 6 nâng cao — Nginx của máy chủ gốc khi đứng sau "máy biên" 10.99.0.1.
# Giống nginx-sunstone.conf của Bài 6, thêm: nạp realip-goc.conf (khôi phục IP thật),
# nạp fail2ban-deny.conf (danh sách chặn do fail2ban ghi) và cho phép máy biên.
# Đặt tại /etc/nginx/sites-available/sunstone (thay tệp của Bài 6).

limit_req_zone $binary_remote_addr zone=sunstone:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/sunstone.crt;
    ssl_certificate_key /etc/nginx/ssl/sunstone.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/sunstone_access.log;
    error_log  /var/log/nginx/sunstone_error.log warn;

    # Khôi phục IP thật: nội dung tệp này thay đổi theo từng bước của bài.
    include /etc/nginx/realip-goc.conf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /fireedge/sunstone;
    }

    location /fireedge {
        # Danh sách chặn do fail2ban (hành động nginx-deny) ghi vào.
        include /etc/nginx/fail2ban-deny.conf;
        allow 127.0.0.1;
        allow 192.168.50.1;
        allow 10.99.0.1;
        deny  all;

        limit_req zone=sunstone burst=40 nodelay;

        proxy_pass http://127.0.0.1:2616;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        client_max_body_size 0;
    }
}
