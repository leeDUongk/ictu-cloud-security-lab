# Bài 6 nâng cao — hành động fail2ban: chặn bằng Nginx (theo IP thật) thay cho iptables.
# Đặt tại /etc/fail2ban/action.d/nginx-deny.conf
[Definition]
actionstart =
actionstop  =
actioncheck =
actionban   = echo "deny <ip>;" >> /etc/nginx/fail2ban-deny.conf && nginx -s reload
actionunban = sed -i "/deny <ip>;/d" /etc/nginx/fail2ban-deny.conf && nginx -s reload
