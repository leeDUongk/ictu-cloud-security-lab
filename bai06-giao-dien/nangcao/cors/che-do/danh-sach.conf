# Che do 4 (danh-sach): chi hai site ve tinh trong map $cors_danh_sach duoc doc, kem cookie.
# Nguon goc khong co trong danh sach -> bien rong -> Nginx khong gui tieu de.
add_header Access-Control-Allow-Origin $cors_danh_sach always;
add_header Access-Control-Allow-Credentials true always;
add_header Vary Origin always;
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_danh_sach always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, PUT" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;
    return 204;
}
