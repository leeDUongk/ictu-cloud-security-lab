# Che do 5 (regex-sai): giong che do 4 nhung so khop bang bieu thuc chinh quy SAI
# (map $cors_regex_sai trong nginx-cors.conf, thieu dau cham truoc daotao).
add_header Access-Control-Allow-Origin $cors_regex_sai always;
add_header Access-Control-Allow-Credentials true always;
add_header Vary Origin always;
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_regex_sai always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, PUT" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;
    return 204;
}
