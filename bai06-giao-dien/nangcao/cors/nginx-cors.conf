# Bai tap nang cao 2 cua Bai thuc hanh 6 (CORS): bon ten mien gia lap tren mot may ONE-Lab.
#   api.daotao.test     API dao tao (tieu de CORS lay tu /etc/nginx/cors-lab/hien-tai.conf)
#   portal.daotao.test  site ve tinh cung site voi API; co them cong /api/ cung nguon goc
#   cntt.khoa.test      site ve tinh khac site
#   la.test, ladaotao.test  trang la
# Tep nay nam trong khoi http (sites-enabled), nen dat duoc map va log_format.

# Che do 4: danh sach cho phep, so khop CHINH XAC tung nguon goc.
map $http_origin $cors_danh_sach {
    default                      "";
    "https://portal.daotao.test" $http_origin;
    "https://cntt.khoa.test"     $http_origin;
}

# Che do 5: bieu thuc chinh quy SAI (thieu dau cham truoc daotao), de doi chieu.
map $http_origin $cors_regex_sai {
    default                     "";
    "~^https://.*daotao\.test$" $http_origin;
}

log_format cors '$remote_addr [$time_local] $host "$request" $status origin="$http_origin"';

ssl_certificate     /etc/nginx/cors-lab/tls.crt;
ssl_certificate_key /etc/nginx/cors-lab/tls.key;

server {
    listen 443 ssl;
    server_name api.daotao.test;
    access_log /var/log/nginx/cors_access.log cors;

    location /api/ {
        include /etc/nginx/cors-lab/hien-tai.conf;
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 443 ssl;
    server_name portal.daotao.test;
    access_log /var/log/nginx/cors_access.log cors;
    root /var/www/cors-lab;

    # Cong API cung nguon goc: trinh duyet goi https://portal.daotao.test/api/..., khong can CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 443 ssl;
    server_name cntt.khoa.test la.test ladaotao.test;
    access_log /var/log/nginx/cors_access.log cors;
    root /var/www/cors-lab;
}
