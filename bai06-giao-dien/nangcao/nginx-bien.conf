# Bài 6 nâng cao — "máy biên" giả lập Cloudflare: nhận HTTPS ở cổng 8443,
# mở kết nối MỚI tới máy chủ gốc từ địa chỉ 10.99.0.1 và gửi kèm CF-Connecting-IP.
# Đặt tại /etc/nginx/sites-available/bien, bật bằng liên kết sang sites-enabled.
server {
    listen 192.168.50.10:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/sunstone.crt;
    ssl_certificate_key /etc/nginx/ssl/sunstone.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/bien_access.log;

    location / {
        proxy_pass https://10.99.0.1:443;
        proxy_bind 10.99.0.1;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Giống Cloudflare: ghi đè địa chỉ thật của người dùng vào tiêu đề.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
