# Bài 6 — Nginx làm proxy TLS trước FireEdge (Sunstone) của OpenNebula 6.10.
# Đặt tại /etc/nginx/sites-available/sunstone, bật bằng liên kết sang sites-enabled.

# Vùng đếm số yêu cầu theo địa chỉ nguồn (khối http).
limit_req_zone $binary_remote_addr zone=sunstone:10m rate=10r/s;

# Cổng 80: chỉ chuyển sang HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/sunstone.crt;
    ssl_certificate_key /etc/nginx/ssl/sunstone.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/sunstone_access.log;
    error_log  /var/log/nginx/sunstone_error.log warn;

    # Tiêu đề bảo mật: đặt ở mức server, không khai báo add_header trong location.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'self'" always;
    # HSTS chỉ bật khi dùng chứng chỉ do CA tin cậy cấp (không bật với chứng chỉ tự ký của lab):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        return 302 /fireedge/sunstone;
    }

    location /fireedge {
        # Giới hạn nguồn truy cập (Phần D thu hẹp lại).
        allow 127.0.0.1;
        allow 192.168.50.0/24;
        deny  all;

        limit_req zone=sunstone burst=40 nodelay;

        proxy_pass http://127.0.0.1:2616;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        client_max_body_size 0;
    }
}
